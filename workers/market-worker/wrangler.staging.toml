name = "scarabev-market-worker-staging"
main = "worker.js"
compatibility_date = "2026-03-13"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
APP_ENV = "staging"
STAGING_CRON_ENABLED = "false"
AGGREGATE_API_URL = "https://scarabev-api-staging.paperpandastacks.workers.dev/api/aggregate"

[[kv_namespaces]]
binding = "EV_HISTORY"
id = "3acaaaca375f47a4beb918a88d5ff8fd"

[[services]]
binding = "SCARABEV_API"
# Replace with staging API service before first deploy.
service = "scarabev-api-staging"
