name = "scarabev-backend-production"
main = "src/index.ts"
compatibility_date = "2026-04-02"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

[vars]
APP_NAME = "scarabev-backend"
APP_ENV = "production"
LOG_LEVEL = "info"
OBS_SAMPLE_RATE = "0.2"
SESSION_TTL_SECONDS = "1800"
SESSION_ROTATION_SECONDS = "600"
BACKUP_ENABLED = "true"
BACKUP_RETENTION_DAYS = "120"
BACKUP_REQUIRE_EXTERNAL = "true"
BACKUP_OBJECT_PREFIX = "snapshots"
BACKUP_CRON_ENABLED = "true"
MARKET_WORKER_URL = "https://scarabev-market-worker.paperpandastacks.workers.dev"
SESSION_API_BASE_URL = "https://scarabev-api.paperpandastacks.workers.dev/admin/sessions"
D1_RESOURCE_LABEL = "scarabev-backend-production"
BACKUP_R2_BUCKET_LABEL = "scarabev-backups-production"

[triggers]
crons = ["0 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "scarabev-backend-production"
database_id = "02b7cda8-ed66-4340-8a44-457226b11ca2"

[[r2_buckets]]
binding = "BACKUP_R2"
bucket_name = "scarabev-backups-production"
