name: frontend-quality

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "js/**"
      - "scripts/frontend-smoke.mjs"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "index.html"
      - "js/**"
      - "scripts/frontend-smoke.mjs"
      - ".github/workflows/frontend-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend module syntax
        run: |
          node --check js/app.js
          node --check js/config.js
          node --check js/market.js
          node --check js/regexEngine.js
          node --check js/scarabEngine.js
          node --check js/state.js
          node --check js/tokenSource.js
          node --check js/hashRouting.js
          node --check js/globalExpose.js

      - name: Frontend smoke checks
        run: node scripts/frontend-smoke.mjs
